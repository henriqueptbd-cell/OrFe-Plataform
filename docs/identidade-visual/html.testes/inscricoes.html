<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrFe — Minhas Inscrições</title>
    <!-- Tailwind CSS Baseline -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Seu arquivo CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#FFFDFB] text-[#1A1A1A] min-h-screen pb-16 pt-12">

    <main class="max-w-4xl mx-auto px-6 space-y-8">

        <!-- Cabeçalho com Botão Voltar -->
        <div class="flex items-center gap-4">
            <button class="text-gray-400 hover:text-gray-600 transition text-xl">
                &langle;
            </button>
            <h1 class="text-2xl font-extrabold text-[#1A1A1A] tracking-tight">
                Minhas Inscrições
            </h1>
        </div>

        <!-- Filtros por Abas (Pill Buttons) -->
        <div class="flex items-center gap-3">
            <button
                class="bg-[#FF6B35] text-white px-5 py-2.5 rounded-full font-bold text-sm shadow-sm shadow-orange-100 transition">
                Próximos
            </button>
            <button
                class="bg-white border border-gray-100 text-gray-500 hover:bg-gray-50 px-5 py-2.5 rounded-full font-semibold text-sm transition">
                Passados
            </button>
        </div>

        <!-- Lista de Inscrições -->
        <div class="space-y-4">

            <!-- Card 1: Confirmado -->
            <div
                class="bg-white rounded-card border border-gray-100 shadow-sm p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-6 hover:shadow-md transition">
                <div class="flex items-center gap-5">
                    <div
                        class="bg-orange-50/60 w-14 h-14 rounded-2xl flex flex-col items-center justify-center text-center shrink-0">
                        <span
                            class="text-[9px] font-bold text-gray-400 uppercase tracking-wider leading-none">JUL</span>
                        <span class="text-lg font-extrabold text-[#FF6B35] mt-0.5 leading-none">20</span>
                    </div>
                    <div class="space-y-0.5">
                        <h3 class="text-base font-bold text-gray-900 tracking-tight">Retiro Espiritual de Verão</h3>
                        <p class="text-xs text-gray-400 font-medium flex items-center gap-1">
                            ⛪ Igreja Graça e Paz
                        </p>
                    </div>
                </div>
                <div
                    class="flex items-center justify-between sm:justify-end gap-6 border-t border-gray-50 pt-3 sm:border-none sm:pt-0">
                    <span class="bg-green-50 text-green-600 text-xs font-bold px-3 py-1.5 rounded-full">
                        Confirmado
                    </span>
                    <button class="text-[#FF6B35] hover:text-[#e05a2b] font-bold text-sm transition">
                        Ver detalhes
                    </button>
                </div>
            </div>

            <!-- Card 2: Pendente -->
            <div
                class="bg-white rounded-card border border-gray-100 shadow-sm p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-6 hover:shadow-md transition">
                <div class="flex items-center gap-5">
                    <div
                        class="bg-orange-50/60 w-14 h-14 rounded-2xl flex flex-col items-center justify-center text-center shrink-0">
                        <span
                            class="text-[9px] font-bold text-gray-400 uppercase tracking-wider leading-none">JUL</span>
                        <span class="text-lg font-extrabold text-[#FF6B35] mt-0.5 leading-none">27</span>
                    </div>
                    <div class="space-y-0.5">
                        <h3 class="text-base font-bold text-gray-900 tracking-tight">Noite de Louvor — Geração</h3>
                        <p class="text-xs text-gray-400 font-medium flex items-center gap-1">
                            ⛪ Comunidade Nova Vida
                        </p>
                    </div>
                </div>
                <div
                    class="flex items-center justify-between sm:justify-end gap-6 border-t border-gray-50 pt-3 sm:border-none sm:pt-0">
                    <span class="bg-amber-50 text-amber-600 text-xs font-bold px-3 py-1.5 rounded-full">
                        Pendente
                    </span>
                    <button class="text-[#FF6B35] hover:text-[#e05a2b] font-bold text-sm transition">
                        Ver detalhes
                    </button>
                </div>
            </div>

        </div>

    </main>

</body>

</html>
